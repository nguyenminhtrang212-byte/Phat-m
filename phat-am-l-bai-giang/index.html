<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Âm /l/ và Consonant Blends · Bài giảng tự học</title>
<style>:root{--bg:#f5faf9;--card:#fff;--ink:#16302d;--mut:#5b7471;--pri:#0f766e;--pri2:#d5f0ef;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#92400e;--warnbg:#fef3c7;--line:#d6e5e3;--hl:#fde68a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b1a;--card:#162826;--ink:#e6f2f0;--mut:#9bb5b1;--pri:#2dd4bf;--pri2:#173a37;--ok:#86efac;--okbg:#14331f;--bad:#fca5a5;--badbg:#3b1717;--warn:#fcd34d;--warnbg:#3b2f10;--line:#25403d;--hl:#5b4a12}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:0 12px 96px}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:20px 16px 16px;border-radius:0 0 22px 22px;margin:0 -12px 10px}
.hero h1{margin:0 0 4px;font-size:22px;line-height:1.25}
.hero .sub{margin:0;opacity:.92;font-size:14px}
.stamp{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:12px;margin-bottom:8px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.pbar{height:8px;background:var(--pri2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.ptxt{font-size:12px;color:var(--mut);margin:3px 0 6px;display:flex;justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip.done::after{content:" ✅"}
.chip.lock{opacity:.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:19px}
.card h3{margin:14px 0 6px;font-size:16px}
p{margin:.45em 0}
ul,ol{margin:.4em 0;padding-left:1.25em}
li{margin:.2em 0}
.tip{background:var(--pri2);border-radius:12px;padding:9px 12px;margin:10px 0;font-size:15px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 12px;margin:10px 0;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.w{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:3px 9px;margin:2px 3px 2px 0;font-size:15px;cursor:pointer}
.w i{font-style:normal;color:var(--mut);font-size:12.5px}
.w:before{content:"🔊";font-size:12px}
.w:active{background:var(--pri2)}
.qz{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.q{margin:10px 0}
.q .qt{font-weight:600;margin-bottom:5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;margin:5px 0;font-size:15px;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt[disabled]{cursor:default}
.x{font-size:14px;color:var(--mut);margin:4px 0 0}
.tick{display:flex;gap:8px;align-items:flex-start;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:9px 12px;margin:12px 0;font-size:15px}
.tick input{margin-top:4px;width:18px;height:18px}
.nav{display:flex;justify-content:space-between;gap:10px;margin:14px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal>div{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:16px;background:var(--bg);color:var(--ink)}
.rec{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.rec .rt{font-weight:600;margin-bottom:6px}
.rec .rrow{display:flex;gap:6px;flex-wrap:wrap}
.rec .rst{font-size:13px;color:var(--mut);margin:6px 0}
.rec label{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:4px 0}
.rec label input{margin-top:3px}
.rec.ok{border-color:var(--ok);background:var(--okbg)}
.score{display:inline-block;background:var(--pri2);border-radius:10px;padding:2px 9px;font-size:13px;font-weight:600}
.big{font-size:17px}
.hl{background:var(--hl);border-radius:4px;padding:0 2px}
.tw{font-size:17px;line-height:1.9}
.tw span{cursor:pointer;border-radius:5px;padding:0 1px}
.tw span.sel{background:var(--hl)}
.tw span.good{background:var(--okbg);color:var(--ok)}
.tw span.miss{outline:2px dashed var(--bad)}
.tw span.wrongsel{background:var(--badbg);color:var(--bad)}
.sortrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sortrow .wd{min-width:92px}
.sortrow .ob{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 9px;font-size:14px;cursor:pointer}
.sortrow .ob.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.sortrow .ob.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.sortrow .fb{font-size:13px;color:var(--mut);flex-basis:100%}
.blank{display:inline-block;min-width:44px;border-bottom:2px solid var(--pri);text-align:center;font-weight:700;color:var(--pri)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:20px 0}
a{color:var(--pri)}
select{padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;max-width:100%;margin:3px 4px 3px 0}
details.card summary{cursor:pointer}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--card);color:var(--ink);min-height:150px;resize:vertical}
input[type=text].ti{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px;background:var(--card);color:var(--ink);width:150px}
.iss{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.iss .fx{font-size:15px}.iss .fx s{color:var(--bad)}.iss .fx b{color:var(--ok)}
.need{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;margin:2px 4px 2px 0;background:var(--pri2)}
.need.ok{background:var(--okbg);color:var(--ok)}
.vc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--card)}
.vc .vh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.vc .vw{font-size:19px;font-weight:700}.vc .vp{font-size:12px;background:var(--pri2);border-radius:8px;padding:1px 7px}
.vc .vi{color:var(--mut)}.vc .vm{font-weight:600;margin:3px 0}.vc .vn{font-size:13px;color:var(--mut)}
.vc .ex{font-size:14.5px;margin:5px 0}.vc .ex b{color:var(--pri)}
</style></head><body>
<div class="wrap">
<header class="hero"><span class="stamp">Tự học · A2-B1</span><h1>Phát âm /l/ và Consonant Blends với L</h1><p class="sub">Học theo thứ tự: đọc lý thuyết, trả lời câu hỏi, rồi mới sang bước tiếp theo.</p></header>
<div class="top"><div class="pbar"><i id="pb"></i></div><div class="ptxt"><span id="pt">0%</span><span id="who"></span></div><div class="chips" id="chips"></div></div>
<main id="main"></main>
<div class="nav"><button class="btn ghost" id="prev">◀ Quay lại</button><button class="btn" id="next">Tiếp tục ▶</button></div>
<p class="foot">Tiến độ lưu trên trình duyệt này. Dùng Chrome hoặc Safari để nghe mẫu và ghi âm.</p>
</div>
<script>/* ===== shared helpers ===== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnf8X3_Xfk9F_8HQtBwSFU_s28sRjxKb0aFaHCA4ybmMJvgaztBAbdvaFzITdbVXBt/exec'; // cổng nhận bài (Apps Script) của cô: ghi âm về Drive, kết quả về Sheet "Kết quả Speaking"
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let VOICE = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const PREF = (() => { try { return JSON.parse(localStorage.getItem('lpage:voice')) || {}; } catch (e) { return {}; } })();
function savePref() { try { localStorage.setItem('lpage:voice', JSON.stringify(PREF)); } catch (e) {} }
function currentVoice() {
  try { const vs = speechSynthesis.getVoices(); return (PREF.voice && vs.find(v => v.name === PREF.voice)) || VOICE; } catch (e) { return VOICE; }
}
function speak(t, rate) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    const v = currentVoice();
    u.lang = v ? v.lang : 'en-US'; if (v) u.voice = v; u.rate = (rate || 0.85) * (PREF.mult || 1);
    speechSynthesis.speak(u);
  } catch (e) {}
}
const Store = {
  key: 'l-x',
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  save(o) { try { localStorage.setItem(this.key, JSON.stringify(o)); } catch (e) {} }
};
function W(word, ipa) { return `<button class="w" data-s="${esc(word)}">${esc(word)}${ipa ? ' <i>' + esc(ipa) + '</i>' : ''}</button>`; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-s]');
  if (b) speak(b.dataset.s, +b.dataset.r || 0.85);
});
function modal(title, html, buttons) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div><h3>${title}</h3><div>${html}</div><div class="row"></div></div>`;
  const row = $('.row', m);
  (buttons || [{ t: 'Đã hiểu' }]).forEach(b => {
    const x = document.createElement('button');
    x.className = 'btn' + (b.ghost ? ' ghost' : '');
    x.textContent = b.t;
    x.onclick = () => { m.remove(); b.f && b.f(); };
    row.appendChild(x);
  });
  document.body.appendChild(m);
  return m;
}
function gate(cb) {
  const st = Store.load();
  if (st.name) { cb(st); return; }
  const m = modal('Chào em! 👋', '<p>Em gõ tên để lưu tiến độ học nhé:</p><input type="text" id="gname" placeholder="Tên của em" autocomplete="name">', [{ t: 'Bắt đầu', f: () => { } }]);
  const inp = $('#gname', m), btn = $('.row .btn', m);
  btn.onclick = () => {
    const v = inp.value.trim().slice(0, 40);
    if (!v) { inp.focus(); return; }
    const s = Store.load(); s.name = v; Store.save(s); m.remove(); cb(s);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  setTimeout(() => inp.focus(), 50);
}
/* Quiz: items [{q,o:[],a,x,say}] ; first-try scoring ; done when all correct */
function Quiz(host, items, onChange) {
  const st = { first: 0, total: items.length, ok: 0, tried: items.map(() => false) };
  host.innerHTML = '';
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'q';
    d.innerHTML = `<div class="qt">${i + 1}. ${it.say ? `<button class="btn sm ghost" data-s="${esc(it.say)}" data-r="0.8">🔊 Nghe</button> ` : ''}${esc(it.q)}</div>` +
      it.o.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join('') + '<div class="x" hidden></div>';
    host.appendChild(d);
    $$('.opt', d).forEach(b => b.onclick = () => {
      if (b.disabled) return;
      const j = +b.dataset.j, x = $('.x', d);
      if (j === it.a) {
        b.classList.add('ok');
        $$('.opt', d).forEach(z => z.disabled = true);
        if (!st.tried[i]) st.first++;
        st.ok++;
        if (it.x) { x.hidden = false; x.textContent = it.x; }
        if (it.say2) speak(it.say2);
        onChange && onChange(st);
      } else {
        b.classList.add('bad'); b.disabled = true; st.tried[i] = true;
        x.hidden = false; x.textContent = 'Chưa đúng, thử lại nhé.';
      }
    });
  });
  st.done = () => st.ok === st.total;
  return st;
}
/* Recorder */
function Recorder(host, opt, onChange) {
  const checks = opt.checks || [];
  const st = { rec: false, checked: checks.map(() => false), sent: false };
  host.className = 'rec';
  host.innerHTML = `<div class="rt">${opt.target}</div>
    <div class="rrow"><button class="btn rb">🎙 Ghi âm</button><button class="btn ghost rp" disabled>▶ Nghe lại</button>
    ${opt.sample ? `<button class="btn ghost" data-s="${esc(opt.sample)}" data-r="0.8">🔊 Nghe mẫu</button>` : ''}
    <a class="btn ghost rd" hidden>⬇ Tải</a>${SCRIPT_URL ? '<button class="btn ghost rs" disabled>📤 Gửi cho cô</button>' : ''}</div>
    <div class="rst">Bấm 🎙, đọc to, bấm lần nữa để dừng. Cho phép micro nếu trình duyệt hỏi.</div>
    ${checks.map((c, i) => `<label><input type="checkbox" data-c="${i}"> ${esc(c)}</label>`).join('')}`;
  const rb = $('.rb', host), rp = $('.rp', host), rd = $('.rd', host), rs = $('.rs', host), rst = $('.rst', host);
  let mr = null, chunks = [], blob = null, audio = null, t0 = 0, stream = null;
  const upd = () => {
    st.done = st.rec && st.checked.every(Boolean) && (!SCRIPT_URL || st.sent);
    host.classList.toggle('ok', st.done);
    onChange && onChange(st);
  };
  rb.onclick = async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { rst.textContent = '⚠️ Chưa có micro. Em bấm "Cho phép" micro cho trang này rồi thử lại nhé.'; return; }
    const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    chunks = [];
    mr = new MediaRecorder(stream, mt ? { mimeType: mt } : undefined);
    mr.ondataavailable = e => e.data && e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const dur = Math.round((Date.now() - t0) / 1000);
      blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      audio = new Audio(url);
      rp.disabled = false; rd.hidden = false; rd.href = url;
      rd.download = (opt.id || 'ghi_am') + (/mp4/.test(blob.type) ? '.m4a' : '.webm');
      if (rs) rs.disabled = false;
      rb.textContent = '🎙 Ghi lại';
      rst.textContent = `✅ Đã ghi ${dur} giây. Nghe lại, tự chấm bên dưới${SCRIPT_URL ? ', rồi bấm 📤 Gửi cho cô' : ''}.`;
      st.rec = true; st.sent = false; st.dur = dur; upd();
    };
    t0 = Date.now(); mr.start();
    rb.textContent = '⏹ Dừng'; rst.textContent = '🔴 Đang ghi âm…';
  };
  rp.onclick = () => audio && audio.play();
  if (rs) rs.onclick = async () => {
    if (!blob) return;
    rs.disabled = true; rst.textContent = 'Đang gửi…';
    try {
      const b64 = await new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(blob); });
      await sendGateway({ type: 'audio', name: Store.load().name || 'Không tên', lesson: LESSON, file: (opt.id || 'GhiAm') + '_01.' + (/mp4/.test(blob.type) ? 'm4a' : 'webm'), mime: blob.type, audio: b64, label: opt.label || '', dur: st.dur || '', target: opt.sample || '' });
      st.sent = true; rst.textContent = '✅ Đã gửi cho cô'; upd();
    } catch (e) { rs.disabled = false; rst.textContent = '⚠️ Chưa gửi được, thử lại nhé.'; }
  };
  $$('input[data-c]', host).forEach(c => c.onchange = () => { st.checked[+c.dataset.c] = c.checked; upd(); });
  st.done = false;
  return st;
}
async function sendGateway(payload) {
  if (!SCRIPT_URL) return { ok: false };
  const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return r.json();
}

function voicePanel() {
  const sel = $('#vsel'), spd = $('#vspd'); if (!sel) return;
  const fill = () => {
    let vs = []; try { vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); } catch (e) {}
    if (!vs.length) { sel.innerHTML = '<option value="">Giọng mặc định của máy</option>'; return; }
    sel.innerHTML = '<option value="">Tự động (mặc định)</option>' + vs.map(v => `<option value="${esc(v.name)}"${PREF.voice === v.name ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  };
  fill(); try { speechSynthesis.addEventListener('voiceschanged', fill); } catch (e) {}
  spd.value = String(PREF.mult || 1);
  sel.onchange = () => { PREF.voice = sel.value; savePref(); };
  spd.onchange = () => { PREF.mult = +spd.value; savePref(); };
  $('#vtry').onclick = () => speak('The clean blue glass is full of cold milk.');
}

/* Nộp bài: kiểm tra, cảnh báo thiếu, gửi về cổng của cô */
function submitFlow(host, o) {
  host.innerHTML = '<p><button class="btn" id="sbtn">📨 Nộp bài cho cô</button> <button class="btn ghost sm" id="copy2">📋 Chép kết quả</button></p><p class="x" id="smsg"></p>';
  const msg = $('#smsg', host);
  const S = () => o.S();
  async function doSend() {
    const p = o.payload(), s = S(), ign = s.ign || 0;
    p.summary.writes = [p.summary.writes, ign ? `đã bỏ qua cảnh báo ${ign} lần` : ''].filter(Boolean).join(' · ');
    msg.textContent = 'Đang nộp bài…';
    try {
      const r = await sendGateway({ type: 'submit', name: s.name || 'Không tên', lesson: LESSON, summary: p.summary, details: p.details });
      if (r && r.ok) { s.submitted = Date.now(); o.save(); msg.innerHTML = '✅ <b>Đã nộp bài cho cô.</b> Em có thể đóng trang. Cô sẽ xem bài và nhận xét.'; }
      else msg.textContent = '⚠️ Chưa nộp được. Em kiểm tra mạng rồi bấm Nộp bài lại nhé.';
    } catch (e) { msg.textContent = '⚠️ Chưa nộp được (mất mạng?). Bấm Nộp bài lại nhé.'; }
  }
  $('#sbtn', host).onclick = () => {
    const w = o.warns();
    if (!w.length) { doSend(); return; }
    modal('Em chưa làm xong', '<ul>' + w.map(x => `<li>${esc(x)}</li>`).join('') + '</ul><p>Em muốn làm tiếp hay vẫn nộp?</p>', [
      { t: 'Quay lại làm tiếp', ghost: true },
      { t: 'Vẫn nộp', f: () => { const s = S(); s.ign = (s.ign || 0) + 1; o.save(); doSend(); } }]);
  };
  $('#copy2', host).onclick = () => { const t = o.text(); try { navigator.clipboard.writeText(t); msg.textContent = 'Đã chép. Em có thể dán vào Zalo gửi cô.'; } catch (e) { msg.textContent = t; } };
  if (S().submitted) msg.innerHTML = '✅ Em đã nộp bài trước đó. Bấm Nộp bài lần nữa nếu em muốn nộp bản mới.';
}

let S = {}, cur = 0;
const live = {}; // per-step live state
function isDone(i) { return !!(S.done && S.done[STEPS[i].id]); }
function firstOpen() { for (let i = 0; i < STEPS.length; i++) if (!isDone(i)) return i; return STEPS.length - 1; }
function maxOpen() { return Math.min(firstOpen(), STEPS.length - 1); }
function setDone(i) {

}
function chrome() {

  $('#who').textContent = S.name ? '👤 ' + S.name : '';
  const mo = maxOpen();
  $('#chips').innerHTML = STEPS.map((s, i) => `<button class="chip${i === cur ? ' on' : ''}${isDone(i) ? ' done' : ''}${i > mo ? ' lock' : ''}" data-i="${i}">${i > mo ? '🔒 ' : ''}${s.t}</button>`).join('');
  $$('#chips .chip').forEach(b => b.onclick = () => go(+b.dataset.i, true));
  $('#prev').disabled = cur === 0;
  $('#next').style.display = cur === STEPS.length - 1 ? 'none' : '';
}
function go(i, fromChip) {
  if (i > maxOpen()) {
    const m = maxOpen();
    modal('Bước này đang khoá 🔒', `<p>Em hãy hoàn thành <b>${STEPS[m].t}</b> trước nhé.</p>`);
    return;
  }
  cur = i; render(); chrome(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function missing(i) {

  if (s.end || isDone(i)) return out;
  const L = live[s.id] || {};
  if (s.read && !(S.ticks && S.ticks[s.id])) out.push('Em chưa tích "Em đã đọc kỹ phần lý thuyết".');
  else if (s.quiz && !(L.quiz && L.quiz.done())) out.push(`Còn ${L.quiz ? L.quiz.total - L.quiz.ok : s.quiz.length} câu hỏi chưa trả lời đúng.`);
  if (s.recs) (L.recs || []).forEach((r, k) => { if (!r.done) out.push(`Bản ghi ${k + 1} chưa ghi âm hoặc chưa tự chấm xong.`); });
  return out;
}
function checkDone(i) {
  if (isDone(i)) return;
  const s = STEPS[i];
  if (missing(i).length === 0 && !s.end) {
    if (s.quiz) { const L = live[s.id]; S.score = S.score || {}; S.score[s.id] = [L.quiz.first, L.quiz.total]; }

    const st = $('#status'); if (st) st.innerHTML = '<div class="tip">✅ Em đã hoàn thành bước này. Bấm "Tiếp tục ▶".</div>';
  }
}
function render() {
  const s = STEPS[cur], main = $('#main');
  main.innerHTML = `<section class="card">${s.html}<div id="quizhost"></div><div id="rechost"></div><div id="status"></div></section>`;
  live[s.id] = live[s.id] || {};
  const L = live[s.id];
  if (s.read) {
    const ticked = S.ticks && S.ticks[s.id];
    const q = $('#quizhost');
    const tk = document.createElement('label');
    tk.className = 'tick'; tk.innerHTML = `<input type="checkbox"${ticked ? ' checked' : ''}> <span>Em đã đọc kỹ phần lý thuyết này</span>`;
    q.parentNode.insertBefore(tk, q);
    const show = () => {
      q.innerHTML = '';
      if (S.ticks && S.ticks[s.id]) {
        q.innerHTML = '<div class="qz"><b>Câu hỏi kiểm tra</b><div id="qb"></div></div>';
        L.quiz = Quiz($('#qb'), s.quiz, () => checkDone(cur));
      }
    };
    $('input', tk).onchange = e => { S.ticks = S.ticks || {}; S.ticks[s.id] = e.target.checked; Store.save(S); show(); };
    show();
  } else if (s.game) {
    $('#quizhost').innerHTML = '<div id="qb"></div>';
    L.quiz = Quiz($('#qb'), s.quiz, () => checkDone(cur));
  } else if (s.rec) {
    L.recs = [];
    s.recs.forEach((r, k) => {
      const d = document.createElement('div'); $('#rechost').appendChild(d);
      L.recs[k] = Recorder(d, { id: r.id, target: esc(r.target), sample: r.sample, checks: r.checks, label: 'Bài giảng - ' + r.id }, () => checkDone(cur));
    });
  } else if (s.end) {
    const rows = STEPS.filter(x => x.quiz && S.score && S.score[x.id]).map(x => `<tr><td>${x.t}</td><td>${S.score[x.id][0]}/${S.score[x.id][1]}</td></tr>`).join('');
    const n = STEPS.filter((x, i) => isDone(i)).length;
    $('#sum').innerHTML = `<p>Em đã hoàn thành <b>${n}/${STEPS.length - 1}</b> bước học.</p><table><tr><th>Bước</th><th>Đúng ngay lần đầu</th></tr>${rows}</table>`;
    const sc = STEPS.filter(x => x.quiz && S.score && S.score[x.id]);
    const txt = `Bài giảng phát âm /l/ - ${S.name || ''}\n` + sc.map(x => `${x.t}: ${S.score[x.id][0]}/${S.score[x.id][1]}`).join('\n');
    submitFlow($('#sub'), { S: () => S, save: () => Store.save(S), text: () => txt,
      warns: () => { const m = STEPS.map((x, i) => (!x.end && !isDone(i)) ? x.t : null).filter(Boolean); return m.length ? ['Chưa hoàn thành: ' + m.join('; ') + '.'] : []; },
      payload: () => {
        const recs = STEPS.filter(x => x.recs).reduce((n, x) => n + x.recs.length, 0);
        return { summary: { recordings: recs, avg: null, full: '', writes: `Hoàn thành ${STEPS.filter((x, i) => !x.end && isDone(i)).length}/${STEPS.length - 1} bước`, quiz: sc.map(x => `${x.t}: ${S.score[x.id][0]}/${S.score[x.id][1]}`).join(' · ') },
          details: sc.map(x => ({ part: 'Bài giảng', question: x.t, answer: `${S.score[x.id][0]}/${S.score[x.id][1]}`, correct: String(S.score[x.id][1]), result: 'đúng ngay lần đầu' })) };
      } });
    if (!isDone(cur)) setDone(cur);
  }
  if (isDone(cur) && !s.end) $('#status').innerHTML = '<div class="tip">✅ Bước này đã hoàn thành. Em có thể làm lại để luyện thêm.</div>';
}
$('#next').onclick = () => {
  const m = missing(cur);
  if (m.length) { modal('Em chưa xong bước này', '<ul>' + m.map(x => `<li>${x}</li>`).join('') + '</ul>'); return; }
  go(cur + 1);
};
$('#prev').onclick = () => go(cur - 1);
gate(st => { S = st; if (!S.ticks) S.ticks = {}; cur = Math.min(firstOpen(), STEPS.length - 1); render(); chrome(); });
</script>
</body></html>
